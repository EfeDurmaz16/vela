openapi: 3.1.0
info:
  title: Vela API
  version: 0.1.0
  description: Trust-first software forge backend API draft.
servers:
  - url: /api/v1
paths:
  /orgs:
    get:
      summary: List organizations visible to the caller
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /auth/workos/login:
    get:
      summary: Create a WorkOS AuthKit authorization URL
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /auth/workos/callback:
    get:
      summary: Exchange a WorkOS authorization code and reconcile identity
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /repos:
    get:
      summary: List repositories
      responses:
        "200": { $ref: "#/components/responses/Collection" }
    post:
      summary: Create a repository in the authenticated organization
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/import:
    post:
      summary: Create or reuse a GitHub import placeholder and queue import
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{id}:
    get:
      summary: Read a repository in the authenticated organization
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Update a repository in the authenticated organization
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a repository in the authenticated organization
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404": { $ref: "#/components/responses/Error" }
  /repos/{id}/import:
    post:
      summary: Queue a repository import
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/JobAccepted" }
  /repos/{id}/readiness:
    get:
      summary: Read repository readiness summary
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Error" }
  /repos/{id}/sync-pull-request:
    post:
      summary: Queue sync of a GitHub pull request into local forge state
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /repos/{id}/trust:
    get:
      summary: Read repository trust signals
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /changes:
    get:
      summary: List changes
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /changes/{id}/readiness:
    get:
      summary: List readiness scores for a change
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /pull-requests:
    get:
      summary: List pull requests
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /pull-requests/{id}/comments:
    post:
      summary: Create a local PR comment and optionally publish to GitHub
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /pull-requests/{id}/merge:
    post:
      summary: Queue a reviewed pull request for merge
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /agents:
    get:
      summary: List agent actors
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /agents/{id}/sessions:
    get:
      summary: List sessions for an agent
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /agents/{id}/policies:
    get:
      summary: List policies for an agent
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /analysis-runs:
    get:
      summary: List analysis runs
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /analysis-runs/{id}/callback:
    post:
      summary: Receive a signed external analysis callback
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: x-vela-timestamp
          in: header
          required: true
          schema: { type: string }
        - name: x-vela-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [completed, failed, cancelled]
                summary:
                  type: string
                completed_at:
                  type: string
                  format: date-time
      responses:
        "202": { $ref: "#/components/responses/Object" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /readiness-scores:
    get:
      summary: List readiness scores
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /merge-candidates:
    get:
      summary: List merge candidates
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /merge-candidates/{id}/cancel:
    post:
      summary: Cancel a queued merge candidate
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /merge-candidates/{id}/simulate:
    post:
      summary: Queue merge simulation
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/JobAccepted" }
  /releases:
    get:
      summary: List release candidates
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /evidence-events:
    get:
      summary: List evidence events
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /integrations:
    get:
      summary: List integrations
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /service-connections:
    get:
      summary: List service connections
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /environments:
    get:
      summary: List environments
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /webhooks/{provider}:
    post:
      summary: Receive a signed provider webhook
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
        - name: x-vela-timestamp
          in: header
          required: false
          schema: { type: string }
        - name: x-vela-signature
          in: header
          required: false
          schema: { type: string }
        - name: x-webhook-timestamp
          in: header
          required: false
          schema: { type: string }
        - name: x-webhook-signature
          in: header
          required: false
          schema: { type: string }
        - name: x-hub-signature-256
          in: header
          required: false
          schema: { type: string }
          description: GitHub HMAC-SHA256 signature in sha256=<hex> form.
        - name: stripe-signature
          in: header
          required: false
          schema: { type: string }
          description: Stripe signature header containing t=<timestamp> and v1=<hex> values.
        - name: workos-signature
          in: header
          required: false
          schema: { type: string }
          description: WorkOS signature header containing t=<timestamp> and v1=<hex> values.
        - name: svix-id
          in: header
          required: false
          schema: { type: string }
        - name: svix-timestamp
          in: header
          required: false
          schema: { type: string }
        - name: svix-signature
          in: header
          required: false
          schema: { type: string }
          description: Svix-style signature header containing one or more v1,<base64> values.
      responses:
        "202":
          description: Accepted for verification and processing
        "401":
          description: Webhook signature verification failed
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 255 }
  responses:
    Collection:
      description: Collection envelope
      content:
        application/json:
          schema:
            type: object
            required: [data, pagination]
            properties:
              data:
                type: array
                items: { type: object }
              pagination:
                $ref: "#/components/schemas/Pagination"
    Object:
      description: Object envelope
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { type: object }
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: object }
    JobAccepted:
      description: Expensive work accepted as a job
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [job]
                properties:
                  job:
                    type: object
                    required: [status, kind]
                    properties:
                      status: { type: string, enum: [queued] }
                      kind: { type: string }
  schemas:
    Pagination:
      type: object
      required: [limit, returned]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        returned: { type: integer, minimum: 0 }
